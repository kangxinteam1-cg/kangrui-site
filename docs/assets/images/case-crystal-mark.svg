<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="驰名商标跨类保护 — 水晶切面与火漆">
  <defs>
    <radialGradient id="bg7" cx="50%" cy="48%" r="70%">
      <stop offset="0%" stop-color="#0e2858"/>
      <stop offset="55%" stop-color="#05152e"/>
      <stop offset="100%" stop-color="#02091a"/>
    </radialGradient>
    <linearGradient id="crystal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ec0ff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#5c81be" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a3a72" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="crystal2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6e6ff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#7ea2da" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3360a8" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="goldS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a7240"/>
      <stop offset="50%" stop-color="#e6caa1"/>
      <stop offset="100%" stop-color="#8a7240"/>
    </linearGradient>
    <linearGradient id="wax" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8493b"/>
      <stop offset="50%" stop-color="#7e2818"/>
      <stop offset="100%" stop-color="#3a0e08"/>
    </linearGradient>
    <radialGradient id="spot7" cx="50%" cy="35%" r="35%">
      <stop offset="0%" stop-color="#d6e6ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7ea2da" stop-opacity="0"/>
    </radialGradient>
    <pattern id="n7" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.4" fill="#fff" fill-opacity="0.020"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg7)"/>
  <rect width="1600" height="900" fill="url(#spot7)"/>

  <!-- crystal prism (faceted) -->
  <g transform="translate(620, 480)">
    <!-- back facets (darker) -->
    <polygon points="-150,-200 -50,-260 60,-220 0,-150" fill="url(#crystal)" stroke="url(#goldS)" stroke-width="0.6" opacity="0.85"/>
    <polygon points="-150,-200 0,-150 -100,-50 -200,-100" fill="url(#crystal)" stroke="url(#goldS)" stroke-width="0.6" opacity="0.75"/>
    <!-- main top facet -->
    <polygon points="-50,-260 60,-220 100,-100 -100,-50 -200,-100" fill="url(#crystal2)" stroke="url(#goldS)" stroke-width="0.8" opacity="0.95"/>
    <!-- right facet -->
    <polygon points="60,-220 100,-100 140,40 80,180 0,-150" fill="url(#crystal)" stroke="url(#goldS)" stroke-width="0.6" opacity="0.85"/>
    <!-- left facet -->
    <polygon points="-200,-100 -100,-50 -60,180 -180,140" fill="url(#crystal)" stroke="url(#goldS)" stroke-width="0.6" opacity="0.75"/>
    <!-- center vertical body -->
    <polygon points="-100,-50 100,-100 140,40 80,180 -60,180" fill="url(#crystal2)" stroke="url(#goldS)" stroke-width="0.8" opacity="0.85"/>
    <!-- bottom -->
    <polygon points="-60,180 80,180 0,260" fill="url(#crystal)" stroke="url(#goldS)" stroke-width="0.6" opacity="0.85"/>
    <!-- bright highlight streak -->
    <polygon points="-50,-258 -10,-100 -50,180" fill="#fff" opacity="0.18"/>
  </g>

  <!-- light refractions: thin gold rays from crystal -->
  <g transform="translate(620, 380)" stroke="url(#goldS)" stroke-width="0.7" opacity="0.45">
    <line x1="0" y1="0" x2="-380" y2="120"/>
    <line x1="0" y1="0" x2="-360" y2="-30"/>
    <line x1="0" y1="0" x2="-300" y2="200"/>
    <line x1="0" y1="0" x2="380" y2="180"/>
    <line x1="0" y1="0" x2="450" y2="80"/>
    <line x1="0" y1="0" x2="-260" y2="280"/>
    <line x1="0" y1="0" x2="320" y2="320"/>
  </g>

  <!-- wax seal (right) -->
  <g transform="translate(1180, 540)">
    <!-- splatter -->
    <path d="M -90,-15 Q -100,-30 -85,-45 L -50,-30 Q -10,-45 30,-30 L 60,-50 L 90,-25 Q 100,-5 85,15 L 60,30 Q 30,45 -10,30 L -50,40 Q -90,30 -100,15 Z" fill="url(#wax)"/>
    <!-- seal disc -->
    <circle cx="0" cy="0" r="68" fill="url(#wax)"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="url(#goldS)" stroke-width="0.8" opacity="0.5"/>
    <!-- emblem inside -->
    <g stroke="url(#goldS)" stroke-width="1.2" fill="none" opacity="0.8">
      <circle cx="0" cy="0" r="44"/>
      <path d="M -22,-10 Q -16,-30 0,-30 Q 16,-30 22,-10 Q 22,18 0,28 Q -22,18 -22,-10 Z"/>
      <line x1="-26" y1="0" x2="26" y2="0" opacity="0.4"/>
    </g>
    <!-- highlight -->
    <ellipse cx="-22" cy="-22" rx="20" ry="10" fill="#fff" opacity="0.15"/>
  </g>

  <rect width="1600" height="900" fill="url(#n7)"/>
  <radialGradient id="vg7" cx="50%" cy="50%" r="65%">
    <stop offset="55%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vg7)"/>
</svg>
