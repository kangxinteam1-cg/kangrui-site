<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="上市护航 — 盾牌">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0e2858"/>
      <stop offset="55%" stop-color="#05152e"/>
      <stop offset="100%" stop-color="#02091a"/>
    </radialGradient>
    <linearGradient id="goldShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6caa1"/>
      <stop offset="35%" stop-color="#c9a77a"/>
      <stop offset="60%" stop-color="#9a7e4e"/>
      <stop offset="100%" stop-color="#6a5128"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a7240"/>
      <stop offset="50%" stop-color="#e6caa1"/>
      <stop offset="100%" stop-color="#8a7240"/>
    </linearGradient>
    <radialGradient id="spot1" cx="50%" cy="35%" r="35%">
      <stop offset="0%" stop-color="#d6b988" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#b89968" stop-opacity="0"/>
    </radialGradient>
    <pattern id="n1" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.4" fill="#fff" fill-opacity="0.020"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg1)"/>
  <rect width="1600" height="900" fill="url(#spot1)"/>

  <!-- shield -->
  <g transform="translate(800, 460)">
    <!-- outer rim -->
    <path d="M -240,-260 Q -240,-270 -230,-270 L 230,-270 Q 240,-270 240,-260 L 240,80 Q 240,180 160,250 Q 80,310 0,330 Q -80,310 -160,250 Q -240,180 -240,80 Z"
          fill="url(#goldShield)" stroke="url(#goldRim)" stroke-width="3"/>
    <!-- inner panel -->
    <path d="M -200,-230 L 200,-230 L 200,80 Q 200,160 140,220 Q 70,270 0,290 Q -70,270 -140,220 Q -200,160 -200,80 Z"
          fill="#0a1f3d" stroke="#3b5d97" stroke-width="1"/>
    <!-- horizontal divider -->
    <line x1="-200" y1="-110" x2="200" y2="-110" stroke="url(#goldRim)" stroke-width="2"/>
    <!-- center medallion -->
    <circle cx="0" cy="50" r="55" fill="none" stroke="url(#goldRim)" stroke-width="2"/>
    <circle cx="0" cy="50" r="40" fill="none" stroke="url(#goldRim)" stroke-width="1" opacity="0.7"/>
    <!-- 8-point star inside medallion -->
    <g transform="translate(0,50)" stroke="url(#goldRim)" stroke-width="1.4" fill="none">
      <line x1="0" y1="-32" x2="0" y2="32"/>
      <line x1="-32" y1="0" x2="32" y2="0"/>
      <line x1="-22" y1="-22" x2="22" y2="22"/>
      <line x1="-22" y1="22" x2="22" y2="-22"/>
    </g>
    <!-- top engraving lines -->
    <line x1="-160" y1="-180" x2="160" y2="-180" stroke="url(#goldRim)" stroke-width="0.8" opacity="0.6"/>
    <line x1="-160" y1="-160" x2="160" y2="-160" stroke="url(#goldRim)" stroke-width="0.8" opacity="0.6"/>
    <!-- rivets -->
    <circle cx="-210" cy="-240" r="5" fill="url(#goldRim)"/>
    <circle cx="210" cy="-240" r="5" fill="url(#goldRim)"/>
    <circle cx="-210" cy="60" r="5" fill="url(#goldRim)"/>
    <circle cx="210" cy="60" r="5" fill="url(#goldRim)"/>
  </g>

  <!-- rising stairs of light below shield -->
  <g opacity="0.45">
    <rect x="640" y="800" width="320" height="3" fill="url(#goldRim)"/>
    <rect x="610" y="830" width="380" height="2" fill="url(#goldRim)" opacity="0.7"/>
    <rect x="580" y="860" width="440" height="2" fill="url(#goldRim)" opacity="0.5"/>
  </g>

  <rect width="1600" height="900" fill="url(#n1)"/>
  <radialGradient id="vg1" cx="50%" cy="50%" r="65%">
    <stop offset="65%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vg1)"/>
</svg>
