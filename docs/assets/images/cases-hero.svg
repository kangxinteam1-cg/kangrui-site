<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1200" preserveAspectRatio="xMidYMid slice" role="img">
<defs>
<radialGradient id="bg" cx="68%" cy="55%" r="80%">
<stop offset="0%" stop-color="#173a76"/>
<stop offset="40%" stop-color="#0a2050"/>
<stop offset="75%" stop-color="#04102a"/>
<stop offset="100%" stop-color="#020a1c"/>
</radialGradient>
<radialGradient id="halo" cx="68%" cy="55%" r="32%">
<stop offset="0%" stop-color="#d6b988" stop-opacity="0.32"/>
<stop offset="50%" stop-color="#b89968" stop-opacity="0.10"/>
<stop offset="100%" stop-color="#b89968" stop-opacity="0"/>
</radialGradient>
<linearGradient id="goldRich" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#f0d6a8"/>
<stop offset="35%" stop-color="#d6b988"/>
<stop offset="70%" stop-color="#a3854f"/>
<stop offset="100%" stop-color="#5a4520"/>
</linearGradient>
<linearGradient id="goldThin" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#8a7240" stop-opacity="0.6"/>
<stop offset="50%" stop-color="#e6caa1"/>
<stop offset="100%" stop-color="#8a7240" stop-opacity="0.6"/>
</linearGradient>
<radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#f0d6a8"/>
<stop offset="60%" stop-color="#b89968" stop-opacity="0.5"/>
<stop offset="100%" stop-color="#b89968" stop-opacity="0"/>
</radialGradient>
<pattern id="ns" width="3" height="3" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="0.4" fill="#fff" fill-opacity="0.012"/>
</pattern>
</defs>

<!-- atmospheric base -->
<rect width="2400" height="1200" fill="url(#bg)"/>
<rect width="2400" height="1200" fill="url(#halo)"/>

<!-- faint atmospheric horizon -->
<line x1="0" y1="900" x2="2400" y2="900" stroke="#1a3565" stroke-width="0.5" opacity="0.35"/>
<line x1="0" y1="940" x2="2400" y2="940" stroke="#1a3565" stroke-width="0.4" opacity="0.25"/>

<!-- ============ Constellation network (background, subtle) ============ -->
<g stroke="url(#goldThin)" stroke-width="0.7" fill="none" opacity="0.32">
<line x1="220" y1="280" x2="480" y2="180"/>
<line x1="480" y1="180" x2="760" y2="320"/>
<line x1="760" y1="320" x2="1040" y2="220"/>
<line x1="220" y1="280" x2="380" y2="540"/>
<line x1="380" y1="540" x2="700" y2="600"/>
<line x1="380" y1="540" x2="220" y2="780"/>
<line x1="220" y1="780" x2="540" y2="900"/>
<line x1="540" y1="900" x2="820" y2="780"/>
<line x1="700" y1="600" x2="820" y2="780"/>
<line x1="760" y1="320" x2="700" y2="600"/>
<line x1="1040" y1="220" x2="1240" y2="380"/>
<line x1="1240" y1="380" x2="1100" y2="600"/>
<line x1="1100" y1="600" x2="900" y2="700"/>
<line x1="540" y1="900" x2="900" y2="700"/>
</g>

<!-- constellation node dots (with soft glow) -->
<g>
<g opacity="0.85">
<circle cx="220" cy="280" r="14" fill="url(#dotGlow)"/>
<circle cx="480" cy="180" r="10" fill="url(#dotGlow)"/>
<circle cx="760" cy="320" r="14" fill="url(#dotGlow)"/>
<circle cx="1040" cy="220" r="9" fill="url(#dotGlow)"/>
<circle cx="380" cy="540" r="14" fill="url(#dotGlow)"/>
<circle cx="700" cy="600" r="11" fill="url(#dotGlow)"/>
<circle cx="220" cy="780" r="9" fill="url(#dotGlow)"/>
<circle cx="540" cy="900" r="13" fill="url(#dotGlow)"/>
<circle cx="820" cy="780" r="10" fill="url(#dotGlow)"/>
<circle cx="900" cy="700" r="9" fill="url(#dotGlow)"/>
<circle cx="1100" cy="600" r="11" fill="url(#dotGlow)"/>
<circle cx="1240" cy="380" r="9" fill="url(#dotGlow)"/>
</g>
<g fill="#f0d6a8">
<circle cx="220" cy="280" r="2.5"/>
<circle cx="480" cy="180" r="2"/>
<circle cx="760" cy="320" r="2.5"/>
<circle cx="1040" cy="220" r="2"/>
<circle cx="380" cy="540" r="2.5"/>
<circle cx="700" cy="600" r="2"/>
<circle cx="220" cy="780" r="2"/>
<circle cx="540" cy="900" r="2.5"/>
<circle cx="820" cy="780" r="2"/>
<circle cx="900" cy="700" r="2"/>
<circle cx="1100" cy="600" r="2"/>
<circle cx="1240" cy="380" r="2"/>
</g>
</g>

<!-- atmospheric particles, sparse -->
<g fill="#d6b988" opacity="0.55">
<circle cx="160" cy="420" r="1"/>
<circle cx="640" cy="200" r="1"/>
<circle cx="900" cy="480" r="1"/>
<circle cx="320" cy="700" r="1"/>
<circle cx="1180" cy="520" r="1"/>
<circle cx="1380" cy="280" r="1"/>
<circle cx="1500" cy="700" r="1"/>
<circle cx="1700" cy="380" r="1"/>
<circle cx="1900" cy="220" r="1"/>
<circle cx="2120" cy="500" r="1"/>
<circle cx="2280" cy="320" r="1"/>
<circle cx="2200" cy="800" r="1"/>
</g>

<!-- ============ Central seal medallion (right of center) ============ -->
<g transform="translate(1640, 600)">
<!-- outer halo -->
<circle r="380" fill="url(#halo)" opacity="0.7"/>

<!-- outermost engraved ring with tick marks -->
<circle r="320" fill="none" stroke="url(#goldRich)" stroke-width="1.2" opacity="0.7"/>
<circle r="316" fill="none" stroke="url(#goldRich)" stroke-width="0.6" opacity="0.5"/>
<g stroke="url(#goldRich)" stroke-width="1" opacity="0.65">
<line x1="0" y1="-318" x2="0" y2="-302"/>
<line x1="113" y1="-298" x2="106" y2="-282" transform="rotate(20)"/>
<line x1="0" y1="-318" x2="0" y2="-302" transform="rotate(20)"/>
<line x1="0" y1="-318" x2="0" y2="-302" transform="rotate(40)"/>
<line x1="0" y1="-318" x2="0" y2="-302" transform="rotate(60)"/>
<line x1="0" y1="-318" x2="0" y2="-302" transform="rotate(80)"/>
<line x1="0" y1="-318" x2="0" y2="-302" transform="rotate(100)"/>
<line x1="0" y1="-318" x2="0" y2="-302" transform="rotate(120)"/>
<line x1="0" y1="-318" x2="0" y2="-302" transform="rotate(140)"/>
<line x1="0" y1="-318" x2="0" y2="-302" transform="rotate(160)"/>
<line x1="0" y1="-318" x2="0" y2="-302" transform="rotate(180)"/>
<line x1="0" y1="-318" x2="0" y2="-302" transform="rotate(200)"/>
<line x1="0" y1="-318" x2="0" y2="-302" transform="rotate(220)"/>
<line x1="0" y1="-318" x2="0" y2="-302" transform="rotate(240)"/>
<line x1="0" y1="-318" x2="0" y2="-302" transform="rotate(260)"/>
<line x1="0" y1="-318" x2="0" y2="-302" transform="rotate(280)"/>
<line x1="0" y1="-318" x2="0" y2="-302" transform="rotate(300)"/>
<line x1="0" y1="-318" x2="0" y2="-302" transform="rotate(320)"/>
<line x1="0" y1="-318" x2="0" y2="-302" transform="rotate(340)"/>
</g>

<!-- ornamental dotted ring -->
<g fill="url(#goldRich)" opacity="0.85">
<circle cx="0" cy="-260" r="3"/>
<circle cx="184" cy="-184" r="3"/>
<circle cx="260" cy="0" r="3"/>
<circle cx="184" cy="184" r="3"/>
<circle cx="0" cy="260" r="3"/>
<circle cx="-184" cy="184" r="3"/>
<circle cx="-260" cy="0" r="3"/>
<circle cx="-184" cy="-184" r="3"/>
</g>

<!-- middle ring -->
<circle r="220" fill="none" stroke="url(#goldRich)" stroke-width="2.5"/>
<circle r="220" fill="none" stroke="url(#goldThin)" stroke-width="0.5" opacity="0.6"/>

<!-- inner field -->
<circle r="180" fill="#0a1f3d"/>
<circle r="180" fill="none" stroke="url(#goldRich)" stroke-width="1"/>

<!-- 12-point compass rose inside -->
<g stroke="url(#goldRich)" stroke-width="1.5" fill="none" opacity="0.8">
<line x1="0" y1="-160" x2="0" y2="160"/>
<line x1="-160" y1="0" x2="160" y2="0"/>
<line x1="-113" y1="-113" x2="113" y2="113"/>
<line x1="-113" y1="113" x2="113" y2="-113"/>
</g>

<!-- compass needle (diamond) pointing up -->
<g fill="url(#goldRich)">
<polygon points="0,-150 14,0 0,18 -14,0" opacity="0.95"/>
<polygon points="0,150 14,0 0,-18 -14,0" opacity="0.55"/>
</g>

<!-- center hub -->
<circle r="22" fill="url(#goldRich)"/>
<circle r="14" fill="#0a1f3d"/>
<circle r="6" fill="url(#goldRich)"/>

<!-- inner radial spokes (small, decorative) -->
<g stroke="url(#goldRich)" stroke-width="0.6" opacity="0.55">
<line x1="0" y1="-220" x2="0" y2="-200"/>
<line x1="0" y1="220" x2="0" y2="200"/>
<line x1="-220" y1="0" x2="-200" y2="0"/>
<line x1="220" y1="0" x2="200" y2="0"/>
</g>
</g>

<!-- decorative side flourish lines -->
<g stroke="url(#goldThin)" stroke-width="0.6" fill="none" opacity="0.4">
<line x1="60" y1="600" x2="900" y2="600"/>
<circle cx="900" cy="600" r="3" fill="url(#goldThin)" stroke="none"/>
</g>

<!-- noise + final vignette -->
<rect width="2400" height="1200" fill="url(#ns)"/>
<radialGradient id="vg" cx="50%" cy="50%" r="75%">
<stop offset="60%" stop-color="#000" stop-opacity="0"/>
<stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
</radialGradient>
<rect width="2400" height="1200" fill="url(#vg)"/>
</svg>
